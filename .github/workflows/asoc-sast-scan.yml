name: "HCL AppScan SAST"

permissions:
  statuses: write
  contents: read

on:
    pull_request:
      branches: [main]
      types: [opened, synchronize]
jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get current date
        id: date
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd HH:mm')" >> $env:GITHUB_OUTPUT

      - name: Run AppScan SAST scan
        id: appscan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@main
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: ${{ secrets.ASOC_APP_ID }}
          scan_name: "SAST ${{ steps.date.outputs.date }} Incremental scan"
          service_url: https://cloud.appscan.com
          static_analysis_only: true
          personal_scan: false
          wait_for_analysis: false
          incremental_scan: true
          sast_scan_id: 2f9a14d3-398a-494c-a3f6-43abb3891eeb
          fail_for_noncompliance: false
          failure_threshold: High
    env: 
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
