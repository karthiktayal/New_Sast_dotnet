name: "HCL AppScan SAST"

permissions:
  statuses: write
  contents: read

on:
    pull_request:
      branches: [main]
      types: [opened, synchronize]
jobs:
  scan:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
        
      - name: Clean AppScan Client Utility Cache
        run: |
          APPSCAN_DIR="$HOME/.appscan"
          if [ -d "$APPSCAN_DIR" ]; then
            echo "Fixing permissions on existing AppScan directory..."
            # Adjust ownership to the current runner user just in case
            sudo chown -R $(whoami):$(id -ng) "$APPSCAN_DIR" || true
            
            echo "Clearing out corrupted installation to force fresh extraction..."
            rm -rf "$APPSCAN_DIR/SAClientUtil.8.0.1731"
          fi
        
      - name: Run AppScan SAST scan
        id: appscan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.1.0
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: ${{ secrets.ASOC_APP_ID }}
          scan_name: "SAST ${{ steps.date.outputs.date }} Incremental scan"
          static_analysis_only: true
          open_source_only: false
          service_url:  https://blmycldtl446131.nonprod.hclpnp.com
          acceptssl: true
          personal_scan: false
          wait_for_analysis: false
          incremental_scan: true
          fail_for_noncompliance: false
          failure_threshold: High
    env: 
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      HOME: ${{ github.workspace }}
