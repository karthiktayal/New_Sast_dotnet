
name: "HCL AppScan SAST for AppScan 360 Instance"
on:
     pull_request:
      branches: [main]
      types: [opened, synchronize]
jobs:
  scan:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.1.4
        with:
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: ${{ secrets.ASOC_APP_ID }}
          service_url: https://cloud.appscan.com
          static_analysis_only: true
          open_source_only: false
          acceptssl: true
          scan_name: "SAST ${{ steps.date.outputs.date }} Incremental scan Clienttype check eu"
          personal_scan: false
          wait_for_analysis: false
          incremental_scan: true
          fail_for_noncompliance: false
          failure_threshold: High
