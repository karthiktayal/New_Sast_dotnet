
name: "HCL AppScan SAST for AppScan 360 Instance"
on:
  workflow_dispatch: 
jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3a5086302da64187c4747ca0ef68518f92064c43
      - name: Run AppScan SAST scan
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@3a5086302da64187c4747ca0ef68518f92064c43
        with:
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: ${{ secrets.ASOC_APP_ID }}
          service_url: https://cloud.appscan.com
          static_analysis_only: true
          open_source_only: false
          acceptssl: true
          scan_name: "SAST ${{ steps.date.outputs.date }} Incremental scan"
          personal_scan: false
          wait_for_analysis: true
          incremental_scan: true
          fail_for_noncompliance: true
          failure_threshold: High
